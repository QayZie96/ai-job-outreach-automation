name: RAY expanded depth — one-time comparison

on:
  push:
    branches:
      - experiment/ray-provider-coverage-audit
    paths:
      - .github/workflows/ray-provider-depth-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Full offline regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Single bounded public-feed depth audit
        run: python provider_depth_audit.py
      - name: Preserve audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ray-provider-depth-audit
          path: provider_depth_results/
          if-no-files-found: warn
          retention-days: 7
