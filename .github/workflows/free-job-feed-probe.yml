name: One-time free job feeds research probe

on:
  push:
    branches:
      - experiment/ray-provider-coverage-audit
    paths:
      - .github/workflows/free-job-feed-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RAY normalization dependencies
        run: python -m pip install -r requirements.txt
      - name: Five public HTTP requests, one per new provider
        run: python free_sources_probe.py --live
      - name: Save read-only source comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-job-feed-api-research
          path: free_source_probe_results/
          if-no-files-found: warn
          retention-days: 7
