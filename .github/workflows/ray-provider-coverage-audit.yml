name: RAY saved Adzuna page — offline-only tests

on:
  push:
    branches:
      - experiment/ray-provider-coverage-audit
    paths:
      - .github/workflows/ray-provider-coverage-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing RAY requirements
        run: python -m pip install -r requirements.txt
      - name: Reproduce locally enabled opt-in budgets in isolated fixture tests
        env:
          PERSONAL_MAX_REMOTE_OK_CALLS: "1"
          PERSONAL_MAX_WWR_CALLS: "1"
          PERSONAL_MAX_REMOTEJOBS_ORG_CALLS: "1"
          PERSONAL_MAX_ADZUNA_CALLS: "1"
        run: python -m unittest discover -s tests -p 'test_personal_discovery.py' -v
      - name: Run complete offline regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
