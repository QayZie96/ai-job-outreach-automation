name: RAY production Sheet isolation — regression

on:
  push:
    branches:
      - experiment/ray-provider-coverage-audit
    paths:
      - .github/workflows/ray-provider-coverage-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing RAY requirements
        run: python -m pip install -r requirements.txt
      - name: Run complete offline regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
